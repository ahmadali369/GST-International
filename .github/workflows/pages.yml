name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build static site
        env:
          GITHUB_PAGES: "1"
          VITE_STATIC_SITE: "1"
          # Set the repo variable API_BASE (Settings > Secrets and variables > Actions > Variables)
          # to your deployed Worker URL to enable the chat and server-side form delivery.
          VITE_API_BASE: ${{ vars.API_BASE }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          npx vite build
          cp dist/client/index.html dist/client/404.html
          touch dist/client/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
